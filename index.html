<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <h1>Kanban-доска</h1>
    <div class="board">
        <div class="column" v-for="(col, index) in columns" :key="index">
            <h3>{{ col.title }}</h3>
            <task-card v-for="card in col.cards" :key="card.id" :card="card" />
            <button v-if="index === 0" @click="openModal()" class="add-btn">
                + Добавить задачу
            </button>
            <p>Задач: {{ col.cards.length }}</p>
        </div>
    </div>

    <div v-if="showModal" class="modal">
        <div class="modal-content">
            <h2>Новая задача</h2>
            <input v-model="newCard.title" placeholder="Заголовок">
            <textarea v-model="newCard.description" placeholder="Описание"></textarea>
            <input type="datetime-local" v-model="newCard.deadline">
            <button @click="createCard" class="btn-primary">Создать</button>
            <button @click="showModal = false" class="btn-danger">Отмена</button>
        </div>
    </div>
</div>
<script src="js/vue.js"></script>
<script src="js/main.js"></script>
</body>
</html>
